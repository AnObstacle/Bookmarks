name: Node CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: npm ci
        run: npm ci
      - name: npm build demo
        run: npm run build:demo
      - name: npm test
        run: npm test
      - name: deploy to firebase (demo)
        if: github.ref == 'refs/heads/master' && matrix.node-version == '22.x'
        run: npm run build:demo && npm run deploy -- --token=${{secrets.FIREBASE_KEY}} -P default
      - name: deploy to firebase (arhs)
        if: github.ref == 'refs/heads/master' && matrix.node-version == '22.x'
        run: npm run build:arhs && npm run deploy -- --token=${{secrets.FIREBASE_KEY}} -P arhs
