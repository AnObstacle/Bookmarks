name: Node CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use latest Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: npm ci
        run: npm ci
      - name: npm build demo
        run: npm run build:demo
      - name: npm test
        run: npm test
      - name: authenticate to google cloud (demo)
        if: github.ref == 'refs/heads/master'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMO }}
      - name: deploy to firebase (demo)
        if: github.ref == 'refs/heads/master'
        run: npm run deploy -- -P default
      - name: authenticate to google cloud (arhs)
        if: github.ref == 'refs/heads/master'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARHS }}
      - name: deploy to firebase (arhs)
        if: github.ref == 'refs/heads/master'
        run: npm run build:arhs && npm run deploy -- -P arhs